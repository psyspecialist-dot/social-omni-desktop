openapi: 3.0.3
info:
  title: Social Najhin External Website — Desktop API
  version: 1.0.0
  description: |
    Contract for a future external website, NOT endpoints implemented in the current app.
    HTTPS only. Never infer access from successful login alone.
    Authenticate -> inspect eligibility -> activate this device -> check entitlement.
    Identity and device are derived from the server-side session, never a submitted user_id.
    All responses (including errors) MUST use Cache-Control: no-store.
    See README.ar.md for security rules, device transactions and GenSpark instructions.
servers:
  - url: https://api.your-domain.invalid
    description: Placeholder only; replace after the website is deployed.
tags:
  - name: Authentication
  - name: Devices
  - name: Entitlement
security:
  - DesktopBearer: []
paths:
  /v1/desktop/auth/login:
    post:
      tags: [Authentication]
      operationId: loginDesktop
      security: []
      summary: Authenticate and create a device-bound session; does not allocate a seat.
      description: |
        Accept exactly ONE credential method. Upsert this user's device as pending
        if new; never reset an existing active/blocked device. Account must be active.
        Return a session even without a purchase, allowing a read-only account screen.
        app_access is false until both eligibility and an active device are present.
        A personal auth token has scope desktop:login and is exchanged, not stored by Electron.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              oneOf:
                - $ref: '#/components/schemas/PasswordLogin'
                - $ref: '#/components/schemas/TokenLogin'
      responses:
        '200':
          description: Authenticated; not proof of app access.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SessionResponse' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '429': { $ref: '#/components/responses/RateLimited' }
        '503': { $ref: '#/components/responses/Unavailable' }
  /v1/desktop/auth/refresh:
    post:
      tags: [Authentication]
      operationId: refreshDesktopSession
      security: []
      summary: Rotate refresh AND access tokens atomically.
      description: |
        Verify token, session, account and absolute session expiry. Device must not be blocked.
        Consume the old refresh token and retain its hash for replay detection.
        A used token replay revokes its entire session family and all access.
        Session absolute lifetime is 30 days from login; rotation does not extend it.
        Reject with SESSION_EXPIRED in its final 900 seconds rather than issuing
        an access token past the absolute session expiry.
        Pending devices can refresh but cannot use protected app features.
        Client MUST serialize refresh requests and must not blindly retry an ambiguous timeout.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [refresh_token]
              properties:
                refresh_token: { $ref: '#/components/schemas/RefreshToken' }
      responses:
        '200':
          description: Fresh tokens; old access token is immediately invalid.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SessionResponse' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '429': { $ref: '#/components/responses/RateLimited' }
        '503': { $ref: '#/components/responses/Unavailable' }
  /v1/desktop/auth/logout:
    post:
      tags: [Authentication]
      operationId: logoutDesktop
      summary: Revoke this session and every refresh token in its family.
      description: |
        Does NOT free the registered device seat. Electron always clears its local
        encrypted credentials, but must not claim server revocation if the request fails.
      responses:
        '204': { description: Session revoked; empty body. }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '503': { $ref: '#/components/responses/Unavailable' }
  /v1/desktop/devices/activate:
    post:
      tags: [Devices]
      operationId: activateCurrentDesktopDevice
      summary: Allocate a seat to the session's device; idempotent.
      description: |
        No request body. In ONE transaction lock the user's entitlement row,
        re-evaluate eligibility, lock the device, count active devices, enforce
        max_devices, then set status=active. Already-active device does not consume
        another seat. Blocked devices cannot activate. A revoked device requires a
        new login session created after revocation. Never accept user_id or max_devices.
      responses:
        '200':
          description: Active device with authoritative access decision.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AccessSnapshot' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '409':
          description: DEVICE_LIMIT_REACHED; no seat allocated and no existing device removed.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorEnvelope' }
        '429': { $ref: '#/components/responses/RateLimited' }
        '503': { $ref: '#/components/responses/Unavailable' }
  /v1/desktop/entitlement:
    get:
      tags: [Entitlement]
      operationId: getDesktopEntitlement
      summary: Read authoritative account, purchase/subscription, and device status.
      description: |
        Read-only: never register, reactivate or allocate a device seat on GET.
        Return 200 with app_access=false for no entitlement, suspended access or
        inactive device when the session itself remains valid.
        Invalid/expired/revoked session returns 401; suspended account returns 403.
        Login and token refresh success NEVER authorize the application by themselves.
      responses:
        '200':
          description: Access decision, including explicit denial.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AccessSnapshot' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '429': { $ref: '#/components/responses/RateLimited' }
        '503': { $ref: '#/components/responses/Unavailable' }
  /v1/desktop/devices:
    get:
      tags: [Devices]
      operationId: listDesktopDevices
      summary: List only devices belonging to the authenticated user.
      parameters:
        - in: query
          name: limit
          schema: { type: integer, minimum: 1, maximum: 100, default: 25 }
        - in: query
          name: cursor
          schema: { type: string, maxLength: 512 }
      responses:
        '200':
          description: Cursor-paginated account device list.
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required: [devices, next_cursor]
                properties:
                  devices:
                    type: array
                    maxItems: 100
                    items: { $ref: '#/components/schemas/Device' }
                  next_cursor: { type: string, nullable: true }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '503': { $ref: '#/components/responses/Unavailable' }
  /v1/desktop/devices/current:
    delete:
      tags: [Devices]
      operationId: detachCurrentDesktopDevice
      summary: Explicitly release this cloud seat and revoke ALL its sessions.
      description: |
        Require user confirmation in Electron. No other device can be detached by
        this endpoint. Lock the entitlement row (same lock as activation), set this
        device revoked, and revoke its sessions/tokens in ONE transaction.
        Authentication uses the old session before revocation; return 204 then sign out.
        Other-device management and permanently blocking a device belong to the
        website with recent reauthentication, outside this desktop API.
      responses:
        '204': { description: Device detached and sessions revoked; empty body. }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '503': { $ref: '#/components/responses/Unavailable' }
components:
  securitySchemes:
    DesktopBearer:
      type: http
      scheme: bearer
      bearerFormat: Opaque access token, 32 random bytes encoded as base64url
  responses:
    BadRequest:
      description: INVALID_REQUEST; reject unexpected properties and invalid JSON.
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ErrorEnvelope' }
    Unauthorized:
      description: INVALID_CREDENTIALS, INVALID_SESSION, SESSION_EXPIRED or REFRESH_REUSED. Never reveal email existence.
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ErrorEnvelope' }
    Forbidden:
      description: ACCOUNT_SUSPENDED, APP_ACCESS_DENIED or DEVICE_BLOCKED.
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ErrorEnvelope' }
    RateLimited:
      description: RATE_LIMITED. Apply IP and account limits; never return credentials.
      headers:
        Retry-After:
          description: Seconds until retry is allowed.
          schema: { type: integer, minimum: 1 }
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ErrorEnvelope' }
    Unavailable:
      description: SERVICE_UNAVAILABLE. Never grant access as a silent fallback.
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ErrorEnvelope' }
  schemas:
    DeviceId:
      type: string
      pattern: '^[a-f0-9]{64}$'
      description: Existing Electron SHA-256 Machine ID; never the raw OS identifier.
    RefreshToken:
      type: string
      pattern: '^[A-Za-z0-9_-]{64}$'
      description: 48 cryptographically random bytes, base64url without padding.
    DeviceInput:
      type: object
      additionalProperties: false
      required: [device_id, name, platform, app_version]
      properties:
        device_id: { $ref: '#/components/schemas/DeviceId' }
        name: { type: string, minLength: 1, maxLength: 128 }
        platform: { type: string, enum: [win32, darwin, linux] }
        app_version: { type: string, minLength: 1, maxLength: 64 }
    PasswordLogin:
      type: object
      additionalProperties: false
      required: [email, password, device]
      properties:
        email: { type: string, format: email, maxLength: 254 }
        password: { type: string, minLength: 1, maxLength: 256, writeOnly: true }
        device: { $ref: '#/components/schemas/DeviceInput' }
    TokenLogin:
      type: object
      additionalProperties: false
      required: [auth_token, device]
      properties:
        auth_token:
          type: string
          pattern: '^snp_[A-Za-z0-9_-]{64}$'
          writeOnly: true
          description: Website-issued personal login token; never a seller password, API secret or SN1 license.
        device: { $ref: '#/components/schemas/DeviceInput' }
    User:
      type: object
      additionalProperties: false
      required: [user_id, email, status]
      properties:
        user_id: { type: string, format: uuid }
        email: { type: string, format: email }
        status: { type: string, enum: [active, suspended] }
    Device:
      type: object
      additionalProperties: false
      required: [device_id, name, platform, app_version, status, is_current, activated_at, last_seen_at]
      properties:
        device_id: { $ref: '#/components/schemas/DeviceId' }
        name: { type: string }
        platform: { type: string, enum: [win32, darwin, linux] }
        app_version: { type: string }
        status: { type: string, enum: [pending, active, revoked, blocked] }
        is_current: { type: boolean }
        activated_at: { type: string, format: date-time, nullable: true }
        last_seen_at: { type: string, format: date-time }
    AccessSnapshot:
      type: object
      additionalProperties: false
      required: [user, device, entitlement, subscription, device_limits, server_time, check_after_seconds, offline_grace_seconds]
      properties:
        user: { $ref: '#/components/schemas/User' }
        device: { $ref: '#/components/schemas/Device' }
        entitlement:
          type: object
          additionalProperties: false
          required: [eligible, app_access, access_model, reason, updates_allowed, support_until]
          properties:
            eligible:
              type: boolean
              description: Account and purchase/subscription permit access BEFORE device-seat enforcement.
            app_access:
              type: boolean
              description: True ONLY when eligible AND the session's device is active.
            access_model:
              type: string
              enum: [none, perpetual, subscription]
            reason:
              type: string
              enum: [OK, NO_ENTITLEMENT, ENTITLEMENT_SUSPENDED, ENTITLEMENT_REVOKED, SUBSCRIPTION_INACTIVE, DEVICE_NOT_ACTIVE, DEVICE_BLOCKED]
            updates_allowed: { type: boolean }
            support_until: { type: string, format: date-time, nullable: true }
        subscription:
          type: object
          additionalProperties: false
          required: [status, current_period_end, cancel_at_period_end]
          properties:
            status:
              type: string
              enum: [none, trialing, active, past_due, canceled, expired]
            current_period_end: { type: string, format: date-time, nullable: true }
            cancel_at_period_end: { type: boolean }
        device_limits:
          type: object
          additionalProperties: false
          required: [max_devices, active_devices]
          properties:
            max_devices: { type: integer, minimum: 0, maximum: 500 }
            active_devices: { type: integer, minimum: 0 }
        server_time: { type: string, format: date-time }
        check_after_seconds: { type: integer, minimum: 1, maximum: 900 }
        offline_grace_seconds:
          type: integer
          enum: [0]
          description: No offline lease in contract v1. No fallback to a local SN1 certificate in cloud mode.
    SessionResponse:
      type: object
      additionalProperties: false
      required: [access_token, refresh_token, token_type, expires_in, session_expires_at, access]
      properties:
        access_token: { type: string, pattern: '^[A-Za-z0-9_-]{43}$' }
        refresh_token: { $ref: '#/components/schemas/RefreshToken' }
        token_type: { type: string, enum: [Bearer] }
        expires_in: { type: integer, enum: [900] }
        session_expires_at: { type: string, format: date-time }
        access: { $ref: '#/components/schemas/AccessSnapshot' }
    ErrorEnvelope:
      type: object
      additionalProperties: false
      required: [error]
      properties:
        error:
          type: object
          additionalProperties: false
          required: [code, message, request_id]
          properties:
            code:
              type: string
              enum: [INVALID_REQUEST, INVALID_CREDENTIALS, INVALID_SESSION, SESSION_EXPIRED, REFRESH_REUSED, ACCOUNT_SUSPENDED, APP_ACCESS_DENIED, DEVICE_BLOCKED, DEVICE_LIMIT_REACHED, RATE_LIMITED, SERVICE_UNAVAILABLE]
            message: { type: string }
            request_id: { type: string, format: uuid }
