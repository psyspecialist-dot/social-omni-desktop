name: Build standalone desktop installers
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'artifacts/social-omni-desktop/**'
      - 'lib/socialomni-api/**'
      - 'lib/api-client-react/**'
      - 'lib/api-zod/**'
      - 'lib/api-spec/**'
      - 'lib/db/**'
      - 'artifacts/api-server/**'
      - 'package.json'
      - 'pnpm-lock.yaml'
      - '.github/workflows/desktop-installers.yml'
permissions:
  contents: read
concurrency:
  group: desktop-installers-${{ github.ref }}
  cancel-in-progress: true
jobs:
  source:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.26.1
      # This selects Node for build commands, independently of GitHub's action runtime.
      - name: Set up Node.js 20 for source export
        uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Verify source build uses Node.js 20
        run: node -e "if (process.versions.node.split('.')[0] !== '20') throw new Error('Source build requires Node.js 20'); console.log(process.version)"
      # CI only needs the renderer here, not Electron's Node-22-only npm installer.
      - run: pnpm install --frozen-lockfile --ignore-scripts
      - run: pnpm --filter @workspace/social-omni-desktop run desktop:export
      - uses: actions/upload-artifact@v4
        with:
          name: standalone-source
          path: artifacts/social-omni-desktop/public/downloads/social-najhin-desktop.zip
          retention-days: 7
  installers:
    needs: source
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-2022
            command: build:win
          - os: macos-14
            command: build:mac
    runs-on: ${{ matrix.os }}
    env:
      CSC_IDENTITY_AUTO_DISCOVERY: 'false'
    steps:
      - uses: pnpm/action-setup@v4
        with:
          version: 10.26.1
      # Applies to every installer job: Windows and macOS both use Node.js 20.
      - name: Set up Node.js 20 for Windows and macOS builds
        uses: actions/setup-node@v4
        with:
          node-version: '20'
      - uses: actions/download-artifact@v4
        with:
          name: standalone-source
          path: ${{ runner.temp }}/najhin-source
      - shell: pwsh
        if: runner.os == 'Windows'
        run: |
          Expand-Archive -Path "$env:RUNNER_TEMP/najhin-source/social-najhin-desktop.zip" -DestinationPath "$env:RUNNER_TEMP/najhin-release"
      - name: Extract standalone source on macOS
        if: runner.os == 'macOS'
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/najhin-release"
          unzip -q "$RUNNER_TEMP/najhin-source/social-najhin-desktop.zip" -d "$RUNNER_TEMP/najhin-release"
      # Deliberately outside the pnpm monorepo: collect standalone production dependencies.
      - shell: pwsh
        name: Install and build Windows x64 NSIS
        if: runner.os == 'Windows'
        working-directory: ${{ runner.temp }}/najhin-release/social-najhin-desktop
        run: |
          # electron-builder downloads the target Electron runtime during packaging.
          # Do not execute Electron's npm installer, which requires Node >=22.12.
          pnpm install --frozen-lockfile --ignore-workspace --ignore-scripts
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          # The app uses built-in/WASM SQLite and npmRebuild:false, not native addons.
          # Skip install-app-deps too; no dependency lifecycle scripts are needed.
          node -e "if (process.versions.node.split('.')[0] !== '20') throw new Error('Installer CI requires Node 20'); for (const name of ['electron-builder','electron-builder-squirrel-windows']) { if (require(name + '/package.json').version !== '26.0.12') throw new Error('Incompatible packaging tool: ' + name); }"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          pnpm run check
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          pnpm run ${{ matrix.command }} --publish never
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Install and build macOS DMG and ZIP
        if: runner.os == 'macOS'
        shell: bash
        working-directory: ${{ runner.temp }}/najhin-release/social-najhin-desktop
        run: |
          set -euo pipefail
          pnpm install --frozen-lockfile --ignore-workspace --ignore-scripts
          node -e "if (process.versions.node.split('.')[0] !== '20') throw new Error('Installer CI requires Node 20'); for (const name of ['electron-builder','electron-builder-squirrel-windows']) { if (require(name + '/package.json').version !== '26.0.12') throw new Error('Incompatible packaging tool: ' + name); }"
          pnpm run check
          pnpm run build:mac --publish never
      - name: Verify Windows NSIS installer and silent installation
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $output = "$env:RUNNER_TEMP/najhin-release/social-najhin-desktop/dist/installers"
          $installers = @(Get-ChildItem "$output/Social-Najhin-*-win-x64.exe")
          if ($installers.Count -ne 1) { throw "Expected one Windows x64 NSIS installer." }
          $installer = $installers[0]
          $stream = [IO.File]::OpenRead($installer.FullName)
          try {
            if ($stream.ReadByte() -ne 77 -or $stream.ReadByte() -ne 90) { throw "Installer is not a Windows executable." }
          } finally { $stream.Dispose() }
          $installDir = "$env:RUNNER_TEMP/najhin-install-check"
          $process = Start-Process -FilePath $installer.FullName -ArgumentList "/S", "/D=$installDir" -Wait -PassThru
          if ($process.ExitCode -ne 0) { throw "NSIS installation failed with $($process.ExitCode)." }
          foreach ($file in @("Social Najhin.exe", "resources/app.asar", "resources/app.asar.unpacked/node_modules/sql.js/dist/sql-wasm.wasm")) {
            if (-not (Test-Path "$installDir/$file")) { throw "Installed runtime missing: $file" }
          }
          if (-not (Test-Path "$installDir/resources/browser-runtime")) { throw "Installed Chromium is missing." }
          $uninstaller = "$installDir/Uninstall Social Najhin.exe"
          if (-not (Test-Path $uninstaller)) { throw "NSIS uninstaller is missing." }
          $process = Start-Process -FilePath $uninstaller -ArgumentList "/S" -Wait -PassThru
          if ($process.ExitCode -ne 0) { throw "NSIS uninstall failed with $($process.ExitCode)." }
      - name: Verify and mount both macOS DMGs
        if: startsWith(matrix.os, 'macos')
        shell: bash
        run: |
          set -euo pipefail
          output="$RUNNER_TEMP/najhin-release/social-najhin-desktop/dist/installers"
          count=0
          mount_point=""
          cleanup() {
            if [ -n "$mount_point" ]; then
              hdiutil detach "$mount_point" || true
              rmdir "$mount_point" || true
            fi
          }
          trap cleanup EXIT
          for image in "$output"/*.dmg; do
            test -f "$image"
            hdiutil verify "$image"
            mount_point="$(mktemp -d)"
            hdiutil attach -readonly -nobrowse -mountpoint "$mount_point" "$image"
            resources="$mount_point/Social Najhin.app/Contents/Resources"
            test -f "$resources/app.asar"
            test -f "$resources/app.asar.unpacked/node_modules/sql.js/dist/sql-wasm.wasm"
            test -d "$resources/browser-runtime"
            hdiutil detach "$mount_point"
            rmdir "$mount_point"
            mount_point=""
            count=$((count + 1))
          done
          test "$count" -eq 2
      - uses: actions/upload-artifact@v4
        with:
          name: installers-${{ matrix.os }}
          path: |
            ${{ runner.temp }}/najhin-release/social-najhin-desktop/dist/installers/*.dmg
            ${{ runner.temp }}/najhin-release/social-najhin-desktop/dist/installers/*.zip
            ${{ runner.temp }}/najhin-release/social-najhin-desktop/dist/installers/*.exe
            ${{ runner.temp }}/najhin-release/social-najhin-desktop/dist/installers/*.blockmap
            ${{ runner.temp }}/najhin-release/social-najhin-desktop/dist/installers/latest*.yml
          compression-level: 0
          if-no-files-found: error
          retention-days: 14
