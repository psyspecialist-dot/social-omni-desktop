kind = "web"
previewPath = "/"
title = "Social Najhin"
description = "A professional local desktop social-management suite with approved WhatsApp and Facebook browser execution, SQLite records, live logs and clearly labeled rehearsals."
version = "1.0.0"
id = "artifacts/social-omni-desktop"
router = "path"

[[services]]
name = "web"
paths = [ "/" ]
localPort = 24944

[services.development]
run = "pnpm --filter @workspace/social-omni-desktop run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/social-omni-desktop", "run", "build" ]
serve = "static"
publicDir = "artifacts/social-omni-desktop/dist/public"

[[services.production.rewrites]]
from = "/*"
to = "/index.html"

[services.env]
PORT = "24944"
BASE_PATH = "/"
