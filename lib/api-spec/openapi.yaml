    SmsTestMessageInput:
      type: object
      required: [recipient, approved]
      properties:
        recipient: {type: string, maxLength: 40}
        recipientName: {type: string, maxLength: 150}
        approved: {type: boolean}
    AdvancedConnection:
      type: object
      required: [id, configured, connected, label, stage, error]
      properties:
        sessionOnly: {type: boolean}
        settings:
          type: object
          properties:
            accountSid: {type: string}
            apiKeySid: {type: string}
            host: {type: string}
            port: {type: integer}
            secure: {type: boolean}
            username: {type: string}
            from: {type: string}
        id: {type: string, enum: [smtp, telegram, twilio]}
        configured: {type: boolean}
        connected: {type: boolean}
        label: {type: string}
        stage: {type: string}
        error: {type: string}
    AdvancedSuite:
      type: object
      required: [tasks, results, connections]
      properties:
        tasks: {type: array, items: {$ref: "#/components/schemas/AdvancedTask"}}
        results: {type: array, items: {$ref: "#/components/schemas/AdvancedResult"}}
        connections: {type: array, items: {$ref: "#/components/schemas/AdvancedConnection"}}
    WaSessionInput:
      type: object
      required: [action, accountId, approved]
      properties:
        action: {type: string, enum: [filter, inbox]}
        accountId: {type: string}
        approved: {type: boolean}
        replyToExistingUnread: {type: boolean, default: false, description: Explicitly approve replies to existing unread messages in opted-in direct chats}
    WaFilterInput:
      type: object
      required: [source]
      properties:
        source: {type: string, maxLength: 10000}
    CrmThreadInput:
      type: object
      required: [name, phone, status, notes, optedIn]
      properties:
        consentChanged: {type: boolean, description: Set false on note-only edits to preserve concurrent opt-outs}
        name: {type: string, maxLength: 150}
        phone: {type: string, maxLength: 30}
        status: {type: string, enum: [New, Follow-up, Closed/Won, Urgent]}
        notes: {type: string, maxLength: 10000}
        tags: {type: array, maxItems: 20, items: {type: string, minLength: 1, maxLength: 50}}
        optedIn: {type: boolean}
    ChatbotRuleInput:
      type: object
      required: [name, keyword, match, template, enabled, delayMin, delayMax, cooldownMinutes]
      properties:
        enabledChanged: {type: boolean, description: Set false on template-only edits to preserve concurrent rule disabling}
        name: {type: string, maxLength: 100}
        keyword: {type: string, maxLength: 200}
        match: {type: string, enum: [contains, exact]}
        template: {type: string, maxLength: 2000}
        enabled: {type: boolean}
        delayMin: {type: integer, minimum: 3, maximum: 8}
        delayMax: {type: integer, minimum: 3, maximum: 8}
        cooldownMinutes: {type: integer, minimum: 1, maximum: 1440}
    ChatbotRule:
      allOf:
        - {$ref: "#/components/schemas/ChatbotRuleInput"}
        - type: object
          required: [id, createdAt]
          properties:
            id: {type: string}
            createdAt: {type: string}
    CrmMessage:
      type: object
      required: [id, text, direction, timestamp, status]
      properties:
        id: {type: string}
        text: {type: string}
        direction: {type: string, enum: [incoming, outgoing]}
        timestamp: {type: string}
        status: {type: string, enum: [Received, Accepted, Unconfirmed]}
        ruleId: {type: string}
    CrmThread:
      allOf:
        - {$ref: "#/components/schemas/CrmThreadInput"}
        - type: object
          required: [id, contactId, messages, updatedAt]
          properties:
            id: {type: string}
            contactId: {type: [string, "null"]}
            accountId: {type: [string, "null"]}
            remoteKey: {type: [string, "null"]}
            updatedAt: {type: string}
            messages: {type: array, items: {$ref: "#/components/schemas/CrmMessage"}}
    WaFilterResult:
      type: object
      required: [id, input, phone, status, reason]
      properties:
        id: {type: string}
        input: {type: string}
        phone: {type: string}
        status: {type: string, enum: [Unverified, Active/Valid, Inactive, Unknown]}
        reason: {type: string}
        checkedAt: {type: [string, "null"]}
    WaAiSettings:
      type: object
      required: [enabled, hasKey, model, instructions, revision]
      properties:
        enabled: {type: boolean}
        hasKey: {type: boolean}
        model: {type: string}
        instructions: {type: string}
        revision: {type: string}
    WaAiInput:
      type: object
      required: [enabled, instructions]
      properties:
        enabled: {type: boolean}
        instructions: {type: string, maxLength: 2000}
        key: {type: string, writeOnly: true, maxLength: 503}
        removeKey: {type: boolean}
    WaMenuInput:
      type: object
      required: [keyword, menu, sales, support]
      properties:
        keyword: {type: string, minLength: 1, maxLength: 200}
        menu: {type: string, minLength: 1, maxLength: 2000}
        sales: {type: string, minLength: 1, maxLength: 2000}
        support: {type: string, minLength: 1, maxLength: 2000}
    WaSuite:
      type: object
      required: [filter, threads, rules]
      properties:
        filter:
          type: object
          required: [source, results]
          properties:
            source: {type: string}
            results: {type: array, items: {$ref: "#/components/schemas/WaFilterResult"}}
        threads: {type: array, items: {$ref: "#/components/schemas/CrmThread"}}
        rules: {type: array, items: {$ref: "#/components/schemas/ChatbotRule"}}
        ai: {$ref: "#/components/schemas/WaAiSettings"}
    BrowserTaskInput:
      type: object
      required: [action, accountId]
      properties:
        action: {type: string, enum: [connect, search, send, join, publish]}
        accountId: {type: string}
        campaignId: {type: string}
        keywords: {type: string, maxLength: 300}
        groupUrls: {type: string, maxLength: 5000}
        approved: {type: boolean, description: Explicit recipient consent or group posting permission attestation}
    SimulatorJobInput:
      type: object
      required: [kind]
      properties:
        mode: {type: string, enum: [live, rehearsal]}
        kind: {type: string, enum: [campaign, whatsapp, leads]}
        campaignId: {type: string}
    SimulatorUploadInput:
      type: object
      required: [name, mime, data]
      properties:
        name: {type: string, maxLength: 200}
        mime: {type: string, enum: [image/png, image/jpeg, image/webp, image/gif, video/mp4, video/webm, application/pdf]}
        data: {type: string, description: Base64 encoded file without a data URL prefix}
    SimulatorSettings:
      type: object
      description: Partial updates preserve omitted fields.
      properties:
        theme: {type: string, enum: [light, dark]}
        language: {type: string, enum: [en, ar], default: en, description: Persisted display language; API enum values and user content remain unchanged.}
        keywords: {type: string, maxLength: 300}
        delayMin: {type: integer, minimum: 5, maximum: 12}
        delayMax: {type: integer, minimum: 5, maximum: 12}
        phoneNumbers: {type: string, maxLength: 10000}
        messageContent: {type: string, maxLength: 10000}
        mediaId: {type: [string, "null"]}
        accountId: {type: [string, "null"]}
        licenseKey: {type: string, readOnly: true, deprecated: true, description: Legacy field only; rejected in settings updates. Use device license activation.}
    SimulatorRecord:
      type: object
      description: Campaign fields title/platform/caption/scheduledAt/status; account fields displayLabel/platform/handle/status; contact fields name/channel/value/optedIn/list.
      properties:
        title: {type: string}
        platform: {type: string, enum: [Facebook, Instagram, WhatsApp, TikTok]}
        caption: {type: string, maxLength: 1000}
        scheduledAt: {type: string}
        status: {type: string}
        keywords: {type: string}
        targetGroupCount: {type: integer, minimum: 1, maximum: 1000}
        mediaId: {type: [string, "null"]}
        accountId: {type: [string, "null"]}
        displayLabel: {type: string}
        handle: {type: string}
        demoSession: {type: string, description: Fake demo- reference only; never an actual session cookie}
        name: {type: string}
        channel: {type: string, enum: [Email, Phone]}
        value: {type: string}
        optedIn: {type: boolean}
        list: {type: string}
    SimulatorMedia:
      type: object
      required: [id, name, mime, size]
      properties:
        id: {type: string}
        name: {type: string}
        mime: {type: string}
        size: {type: integer}
        dataUrl: {type: string}
    SimulatorTarget:
      type: object
      required: [id, name, joinStatus, postStatus, sendStatus]
      properties:
        id: {type: string}
        name: {type: string}
        joinStatus: {type: string, enum: [Pending, Joined, Requested, Needs review]}
        postStatus: {type: string, enum: [Pending, Posted, Not posted, Unconfirmed]}
