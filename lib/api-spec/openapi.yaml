openapi: 3.1.0
info:
  # Do not change the title, if the title changes, the import paths will be broken
  title: Api
  version: 0.1.0
  description: API specification
servers:
  - url: /api
    description: Base API path
tags:
  - name: health
    description: Health operations
paths:
  /seller-dashboard/session:
    get:
      operationId: getSellerSession
      summary: Seller-only dashboard session and issuer readiness
      responses:
        "200":
          description: Session state; issuer details are restricted to signed-in sellers
          content:
            application/json:
              schema: {$ref: "#/components/schemas/SellerSession"}
    post:
      operationId: loginSeller
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: "#/components/schemas/SellerLoginInput"}
      responses:
        "200":
          description: Authenticated seller session
          content:
            application/json:
              schema: {$ref: "#/components/schemas/SellerSession"}
        "401": {description: Incorrect seller password}
        "429": {description: Too many sign-in attempts}
        "503": {description: Seller password not configured}
    delete:
      operationId: logoutSeller
      responses:
        "200":
          description: Signed out
          content:
            application/json:
              schema: {$ref: "#/components/schemas/SellerSession"}
  /seller-dashboard/licenses:
    post:
      operationId: generateSellerLicense
      summary: Issue a signed offline certificate using the existing private issuer
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: "#/components/schemas/SellerLicenseInput"}
      responses:
        "201":
          description: Device-bound license; never includes signing secrets
          content:
            application/json:
              schema: {$ref: "#/components/schemas/SellerLicenseResult"}
        "400": {description: Invalid Device ID or plan}
        "401": {description: Seller sign-in required}
        "503": {description: Existing issuer missing or does not match desktop public key}
  /socialomni/advanced/tasks:
    post:
      operationId: createAdvancedTask
      parameters: [{$ref: "#/components/parameters/Workspace"}]
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: "#/components/schemas/AdvancedTaskInput"}
      responses:
        "200": {$ref: "#/components/responses/WorkspaceState"}
  /socialomni/advanced/tasks/{id}:
    patch:
      operationId: editAdvancedTask
      parameters: [{$ref: "#/components/parameters/Workspace"}, {$ref: "#/components/parameters/RecordId"}]
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: "#/components/schemas/AdvancedTaskInput"}
      responses:
        "200": {$ref: "#/components/responses/WorkspaceState"}
    delete:
      operationId: deleteAdvancedTask
      parameters: [{$ref: "#/components/parameters/Workspace"}, {$ref: "#/components/parameters/RecordId"}]
      responses:
        "200": {$ref: "#/components/responses/WorkspaceState"}
  /socialomni/advanced/tasks/{id}/run:
    post:
      operationId: runAdvancedTask
      parameters: [{$ref: "#/components/parameters/Workspace"}, {$ref: "#/components/parameters/RecordId"}]
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: "#/components/schemas/AdvancedApproval"}
      responses:
        "200": {$ref: "#/components/responses/WorkspaceState"}
  /socialomni/advanced/tasks/{id}/cancel:
    post:
      operationId: cancelAdvancedTask
      parameters: [{$ref: "#/components/parameters/Workspace"}, {$ref: "#/components/parameters/RecordId"}]
      responses:
        "200": {$ref: "#/components/responses/WorkspaceState"}
  /socialomni/advanced/connections/{id}:
    put:
      operationId: saveAdvancedConnection
      parameters: [{$ref: "#/components/parameters/Workspace"}, {$ref: "#/components/parameters/RecordId"}]
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: "#/components/schemas/AdvancedConnectionInput"}
      responses:
        "200": {$ref: "#/components/responses/WorkspaceState"}
    delete:
      operationId: deleteAdvancedConnection
      parameters: [{$ref: "#/components/parameters/Workspace"}, {$ref: "#/components/parameters/RecordId"}]
      responses:
        "200": {$ref: "#/components/responses/WorkspaceState"}
  /socialomni/advanced/smtp/test-message:
    post:
      operationId: sendSmtpTestMessage
      parameters: [{$ref: "#/components/parameters/Workspace"}]
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: "#/components/schemas/SmtpTestMessageInput"}
      responses:
        "200": {$ref: "#/components/responses/WorkspaceState"}
  /socialomni/advanced/sms/test-message:
    post:
      operationId: sendSmsTestMessage
      parameters: [{$ref: "#/components/parameters/Workspace"}]
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: "#/components/schemas/SmsTestMessageInput"}
      responses:
        "200": {$ref: "#/components/responses/WorkspaceState"}
  /socialomni/advanced/sms/results/{id}/refresh:
    post:
      operationId: refreshSmsResult
      parameters: [{$ref: "#/components/parameters/Workspace"}, {$ref: "#/components/parameters/RecordId"}]
      responses:
        "200": {$ref: "#/components/responses/WorkspaceState"}
  /socialomni/advanced/telegram/auth:
    post:
      operationId: authorizeTelegram
      parameters: [{$ref: "#/components/parameters/Workspace"}]
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: "#/components/schemas/TelegramAuthInput"}
      responses:
        "200": {$ref: "#/components/responses/WorkspaceState"}
  /socialomni/advanced/results/{id}:
    delete:
      operationId: deleteAdvancedResult
      parameters: [{$ref: "#/components/parameters/Workspace"}, {$ref: "#/components/parameters/RecordId"}]
      responses:
        "200": {$ref: "#/components/responses/WorkspaceState"}
  /socialomni/suite/ai:
    put:
      operationId: saveWaAi
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: "#/components/schemas/WaAiInput"}
      responses:
        "200":
          description: Public configuration only; never returns the key
          content:
            application/json:
              schema: {$ref: "#/components/schemas/SimulatorState"}
  /socialomni/suite/menu:
    put:
      operationId: saveWaMenu
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: "#/components/schemas/WaMenuInput"}
      responses:
        "200":
          description: Saved exact-match menu rules
          content:
            application/json:
              schema: {$ref: "#/components/schemas/SimulatorState"}
  /socialomni/suite/filter:
    put:
      operationId: saveWaFilter
      parameters: [{$ref: "#/components/parameters/Workspace"}]
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: "#/components/schemas/WaFilterInput"}
      responses:
        "200": {$ref: "#/components/responses/WorkspaceState"}
  /socialomni/suite/threads:
    post:
      operationId: createCrmThread
      parameters: [{$ref: "#/components/parameters/Workspace"}]
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: "#/components/schemas/CrmThreadInput"}
      responses:
        "200": {$ref: "#/components/responses/WorkspaceState"}
  /socialomni/suite/threads/{id}:
    patch:
      operationId: editCrmThread
      parameters: [{$ref: "#/components/parameters/Workspace"}, {$ref: "#/components/parameters/RecordId"}]
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: "#/components/schemas/CrmThreadInput"}
      responses:
        "200": {$ref: "#/components/responses/WorkspaceState"}
    delete:
      operationId: removeCrmThread
      parameters: [{$ref: "#/components/parameters/Workspace"}, {$ref: "#/components/parameters/RecordId"}]
      responses:
        "200": {$ref: "#/components/responses/WorkspaceState"}
  /socialomni/suite/rules:
    post:
      operationId: createChatbotRule
      parameters: [{$ref: "#/components/parameters/Workspace"}]
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: "#/components/schemas/ChatbotRuleInput"}
      responses:
        "200": {$ref: "#/components/responses/WorkspaceState"}
  /socialomni/suite/rules/{id}:
    patch:
      operationId: editChatbotRule
      parameters: [{$ref: "#/components/parameters/Workspace"}, {$ref: "#/components/parameters/RecordId"}]
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: "#/components/schemas/ChatbotRuleInput"}
      responses:
        "200": {$ref: "#/components/responses/WorkspaceState"}
    delete:
      operationId: removeChatbotRule
      parameters: [{$ref: "#/components/parameters/Workspace"}, {$ref: "#/components/parameters/RecordId"}]
      responses:
        "200": {$ref: "#/components/responses/WorkspaceState"}
  /socialomni/suite/session:
    post:
      operationId: startWaSuiteSession
      parameters: [{$ref: "#/components/parameters/Workspace"}]
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: "#/components/schemas/WaSessionInput"}
      responses:
        "200": {$ref: "#/components/responses/WorkspaceState"}
  /socialomni/browser/jobs:
    post:
      operationId: startLocalBrowserTask
      summary: Start an explicitly approved desktop-only browser task
      parameters:
        - $ref: "#/components/parameters/Workspace"
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: "#/components/schemas/BrowserTaskInput"}
      responses:
        "200":
          $ref: "#/components/responses/WorkspaceState"
        "400":
          description: Invalid task or missing consent
        "422":
          description: Local browser execution is unavailable in hosted preview
  /socialomni/download:
    get:
      operationId: downloadDesktopPackage
      summary: Download the complete standalone desktop application ZIP
      responses:
        "200":
          description: ZIP attachment with desktop runtime and application source
          headers:
            Content-Disposition:
              schema:
                type: string
          content:
            application/zip:
              schema:
                type: string
                format: binary
        "503":
          description: Desktop package has not been generated
  /socialomni/leads:
    put:
      operationId: saveSocialOmniLeadDraft
      parameters: [{$ref: "#/components/parameters/Workspace"}]
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: "#/components/schemas/SimulatorLeadInput"}
      responses:
        "200":
          $ref: "#/components/responses/WorkspaceState"
    delete:
      operationId: clearSocialOmniLeads
      description: Clears synthetic results only; refuses while a lead simulation is active.
      parameters: [{$ref: "#/components/parameters/Workspace"}]
      responses:
        "200":
          $ref: "#/components/responses/WorkspaceState"
  /socialomni/state:
    get:
      operationId: getSocialOmniState
      parameters: [{$ref: "#/components/parameters/Workspace"}]
      responses:
        "200":
          $ref: "#/components/responses/WorkspaceState"
    delete:
      operationId: clearSocialOmniState
      parameters: [{$ref: "#/components/parameters/Workspace"}]
      responses:
        "200":
          $ref: "#/components/responses/WorkspaceState"
  /socialomni/license:
    get:
      operationId: getDeviceLicense
      parameters: [{$ref: "#/components/parameters/Workspace"}]
      responses:
        "200": {$ref: "#/components/responses/WorkspaceState"}
    delete:
      operationId: removeDeviceCertificate
      description: Desktop only. Removes the local certificate, never frees a registered seat. Stop running and scheduled tasks first.
      parameters: [{$ref: "#/components/parameters/Workspace"}]
      responses:
        "200": {$ref: "#/components/responses/WorkspaceState"}
  /socialomni/license/activate:
    post:
      operationId: activateDeviceLicense
      parameters: [{$ref: "#/components/parameters/Workspace"}]
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: "#/components/schemas/LicenseActivationInput"}
      responses:
        "200": {$ref: "#/components/responses/WorkspaceState"}
  /socialomni/licensing/activate:
    post:
      operationId: registerLicenseMachine
      description: Central atomic device registration. Re-activation of the same machine consumes no additional seat.
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: "#/components/schemas/LicenseRegistrationInput"}
      responses:
        "200":
          description: Signed permanent device entitlement and dated support entitlement
          content:
            application/json:
              schema: {$ref: "#/components/schemas/LicenseCertificate"}
  /socialomni/licensing/public-key:
    get:
      operationId: getLicenseAuthorityPublicKey
      responses:
        "200":
          description: Public key; must be pinned in the desktop release, never trusted dynamically by the renderer
          content:
            application/json:
              schema: {$ref: "#/components/schemas/LicenseAuthorityKey"}
  /socialomni/licensing/admin/licenses:
    get:
      operationId: listIssuedLicenses
      security: [{LicenseAdmin: []}]
      responses:
        "200":
          description: Owner-only license ledger
          content:
            application/json:
              schema:
                type: object
                properties:
                  licenses: {type: array, items: {type: object, additionalProperties: true}}
    post:
      operationId: issueLicensePack
      security: [{LicenseAdmin: []}]
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: "#/components/schemas/LicensePackInput"}
      responses:
        "201":
          description: Buyer key returned once to the authenticated owner
          content:
            application/json:
              schema: {$ref: "#/components/schemas/IssuedLicensePack"}
  /socialomni/licensing/admin/licenses/{id}/renew:
    post:
      operationId: renewLicenseSupport
      security: [{LicenseAdmin: []}]
      parameters: [{$ref: "#/components/parameters/RecordId"}]
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: "#/components/schemas/LicenseSupportInput"}
      responses:
        "200":
          description: Support period updated; device must re-activate to download the new signed period
          content:
            application/json:
              schema: {type: object, additionalProperties: true}
  /socialomni/licensing/admin/licenses/{id}/disable:
    post:
      operationId: disableLicensePack
      security: [{LicenseAdmin: []}]
      parameters: [{$ref: "#/components/parameters/RecordId"}]
      responses:
        "200":
          description: Further activations disabled; previously issued offline certificates remain valid
          content:
            application/json:
              schema: {type: object, additionalProperties: true}
  /socialomni/settings:
    put:
      operationId: updateSocialOmniSettings
      parameters: [{$ref: "#/components/parameters/Workspace"}]
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: "#/components/schemas/SimulatorSettings"}
      responses:
        "200":
          $ref: "#/components/responses/WorkspaceState"
  /socialomni/jobs:
    post:
      operationId: createSocialOmniJob
      description: Creates a local simulation, never a platform action. Inputs are snapshotted from the saved draft.
      parameters: [{$ref: "#/components/parameters/Workspace"}]
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: "#/components/schemas/SimulatorJobInput"}
      responses:
        "200":
          $ref: "#/components/responses/WorkspaceState"
  /socialomni/jobs/{id}/cancel:
    post:
      operationId: cancelSocialOmniJob
      parameters:
        - {$ref: "#/components/parameters/Workspace"}
        - {$ref: "#/components/parameters/RecordId"}
      responses:
        "200":
          $ref: "#/components/responses/WorkspaceState"
  /socialomni/media:
    post:
      operationId: uploadSocialOmniMedia
      description: Stores image, video, or PDF bytes in local SQLite, limited to 5 MiB per file and 50 MiB per workspace. Live desktop WhatsApp jobs can attach these files.
      parameters: [{$ref: "#/components/parameters/Workspace"}]
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: "#/components/schemas/SimulatorUploadInput"}
      responses:
        "200":
          $ref: "#/components/responses/WorkspaceState"
  /socialomni/media/{id}:
    get:
      operationId: readSocialOmniMedia
      parameters:
        - {$ref: "#/components/parameters/Workspace"}
        - {$ref: "#/components/parameters/RecordId"}
      responses:
        "200":
          $ref: "#/components/responses/WorkspaceState"
    delete:
      operationId: deleteSocialOmniMedia
      description: Refuses to delete attachments referenced by a draft or an active simulation.
      parameters:
        - {$ref: "#/components/parameters/Workspace"}
        - {$ref: "#/components/parameters/RecordId"}
      responses:
        "200":
          $ref: "#/components/responses/WorkspaceState"
  /socialomni/{collection}:
    parameters:
      - {$ref: "#/components/parameters/Workspace"}
      - {$ref: "#/components/parameters/Collection"}
    post:
      operationId: createSocialOmniRecord
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: "#/components/schemas/SimulatorRecord"}
      responses:
        "200":
          $ref: "#/components/responses/WorkspaceState"
  /socialomni/{collection}/{id}:
    parameters:
      - {$ref: "#/components/parameters/Workspace"}
      - {$ref: "#/components/parameters/Collection"}
      - {$ref: "#/components/parameters/RecordId"}
    patch:
      operationId: updateSocialOmniRecord
      description: Full editable record fields, excluding server-owned ID and timestamps.
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: "#/components/schemas/SimulatorRecord"}
      responses:
        "200":
          $ref: "#/components/responses/WorkspaceState"
    delete:
      operationId: deleteSocialOmniRecord
      responses:
        "200":
          $ref: "#/components/responses/WorkspaceState"
  /healthz:
    get:
      operationId: healthCheck
      tags: [health]
      summary: Health check
      description: Returns server health status
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"
components:
  securitySchemes:
    LicenseAdmin:
      type: http
      scheme: bearer
      description: Owner-only administration token; never stored in the renderer or desktop release
  parameters:
    Workspace:
      name: x-socialomni-workspace
      in: header
      required: true
      schema: {type: string, format: uuid}
    RecordId:
      name: id
      in: path
      required: true
      schema: {type: string}
    Collection:
      name: collection
      in: path
      required: true
      schema: {type: string, enum: [campaigns, accounts, contacts]}
  responses:
    WorkspaceState:
      description: Updated workspace state; invalid inputs return 400 with an error message; missing records return 404.
      content:
        application/json:
          schema: {$ref: "#/components/schemas/SimulatorState"}
  schemas:
    SellerSession:
      type: object
      required: [authenticated, passwordConfigured, issuerReady, setupError]
      properties:
        authenticated: {type: boolean}
        passwordConfigured: {type: boolean}
        issuerReady: {type: boolean}
        setupError: {type: [string, "null"]}
        sessionToken: {type: [string, "null"], description: Short-lived seller access token returned only at sign-in; never the private signing key}
    SellerLoginInput:
      type: object
      additionalProperties: false
      required: [password]
      properties:
        password: {type: string, minLength: 1, maxLength: 256, writeOnly: true}
    SellerLicenseInput:
      type: object
      additionalProperties: false
      required: [deviceId, plan]
      properties:
        deviceId: {type: string, pattern: "^[a-fA-F0-9]{64}$"}
        plan: {type: string, enum: [lifetime, yearly, monthly, none]}
    SellerLicenseResult:
      type: object
      required: [licenseKey, licenseId, deviceId, plan, supportUntil]
      properties:
        licenseKey: {type: string}
        licenseId: {type: string}
        deviceId: {type: string}
        plan: {type: string, enum: [lifetime, yearly, monthly, none]}
        supportUntil: {type: [string, "null"]}
    LicensePackInput:
      type: object
      properties:
        maxDevices: {type: integer, minimum: 1, maximum: 10000, default: 1}
        supportPlan: {type: string, enum: [none, monthly, yearly], default: none}
    IssuedLicensePack:
      type: object
      required: [licenseId, key, maxDevices, supportPlan]
      properties:
        licenseId: {type: string, format: uuid}
        key: {type: string}
        maxDevices: {type: integer}
        supportPlan: {type: string, enum: [none, monthly, yearly]}
        supportUntil: {type: [string, "null"]}
    LicenseSupportInput:
      type: object
      required: [supportPlan]
      properties:
        supportPlan: {type: string, enum: [monthly, yearly]}
    LicenseActivationInput:
      type: object
      required: [key]
      properties:
        key: {type: string, pattern: "^SNK-[A-Za-z0-9_-]{43}$"}
    LicenseRegistrationInput:
      type: object
      required: [key, machineId]
      properties:
        key: {type: string, pattern: "^SNK-[A-Za-z0-9_-]{43}$"}
        machineId: {type: string, pattern: "^[a-f0-9]{64}$", description: Product-scoped hash of the OS machine identifier}
    LicenseCertificate:
      type: object
      required: [certificate]
      properties:
        certificate: {type: string, description: Ed25519-signed SN1 device certificate}
    LicenseAuthorityKey:
      type: object
      required: [publicKey, algorithm]
      properties:
        publicKey: {type: string, description: Base64 DER SPKI public key, not a secret}
        algorithm: {type: string, enum: [Ed25519]}
    DeviceLicenseStatus:
      type: object
      required: [native, configured, status, machineId, licenseId, maxDevices, devicesUsed, kind, supportPlan, supportUntil, supportActive, activatedAt, serverUrl, error]
      properties:
        native: {type: boolean}
        configured: {type: boolean}
        status: {type: string, enum: [active, not_activated, invalid, unconfigured, desktop_only]}
        machineId: {type: [string, "null"]}
        licenseId: {type: [string, "null"]}
        maxDevices: {type: [integer, "null"]}
        devicesUsed: {type: [integer, "null"], description: Count at last activation; not a live count when offline}
        kind: {type: [string, "null"], enum: [standard, reseller, null]}
        supportPlan: {type: [string, "null"], enum: [none, monthly, yearly, null]}
        supportUntil: {type: [string, "null"]}
        supportActive: {type: boolean}
        activatedAt: {type: [string, "null"]}
        serverUrl: {type: string}
        error: {type: [string, "null"]}
    AdvancedApproval:
      type: object
      required: [approved]
      properties:
        approved: {type: boolean}
    TelegramAuthInput:
      type: object
      required: [action, value]
      properties:
        action: {type: string, enum: [start, code, password]}
        value: {type: string, maxLength: 300}
    AdvancedConnectionInput:
      type: object
      properties:
        sessionOnly: {type: boolean}
        accountSid: {type: string}
        apiKeySid: {type: string}
        apiKeySecret: {type: string}
        host: {type: string}
        port: {type: integer}
        secure: {type: boolean}
        username: {type: string}
        password: {type: string}
        from: {type: string}
        apiId: {type: integer}
        apiHash: {type: string}
    AdvancedTaskInput:
      type: object
      required: [kind, name]
      properties:
        kind: {type: string, enum: [whatsapp-members, maps, b2b, verify-email, email-send, sms-send, telegram-send, telegram-members, telegram-channel, facebook-search, facebook-join, facebook-post, instagram-post]}
        name: {type: string, maxLength: 150}
        source: {type: string, maxLength: 15000}
        message: {type: string, maxLength: 10000}
        subject: {type: string, maxLength: 200}
        query: {type: string, maxLength: 300}
        limit: {type: integer, minimum: 1, maximum: 2000, description: "WhatsApp member extraction allows 2000; other task kinds allow 200."}
        accountId: {type: string}
        mediaId: {type: string}
        scheduledAt: {type: string}
        approved: {type: boolean}
    AdvancedTask:
      allOf:
        - {$ref: "#/components/schemas/AdvancedTaskInput"}
        - type: object
          required: [id, status, progress, completedCount, totalCount, phase, createdAt, error]
          properties:
            id: {type: string}
            status: {type: string, enum: [Draft, Scheduled, Queued, Running, Completed, Cancelled, Failed, Needs review]}
            progress: {type: integer}
            completedCount: {type: integer}
            totalCount: {type: integer}
            phase: {type: string}
            createdAt: {type: string}
            error: {type: string}
            nextActionAt: {type: [string, "null"]}
    AdvancedResult:
      type: object
      required: [id, taskId, kind, name, phone, email, address, website, status, reason, createdAt]
      properties:
        providerId: {type: string}
        providerStatus: {type: string}
        providerAccountSid: {type: string}
        providerErrorCode: {type: integer}
        estimatedSegments: {type: integer}
        encoding: {type: string, enum: [GSM-7, UCS-2]}
        segments: {type: integer}
        statusCheckedAt: {type: string}
        statusRefreshError: {type: string}
        userId: {type: string}
        username: {type: string}
        id: {type: string}
        taskId: {type: string}
        kind: {type: string}
        name: {type: string}
        phone: {type: string}
        email: {type: string}
        address: {type: string}
        website: {type: string}
        status: {type: string}
        reason: {type: string}
        createdAt: {type: string}
    SmtpTestMessageInput:
      type: object
      required: [recipient, approved]
      properties:
        recipient: {type: string, maxLength: 254}
        recipientName: {type: string, maxLength: 150}
