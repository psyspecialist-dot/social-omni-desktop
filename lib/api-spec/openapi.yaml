openapi: 3.1.0
info:
  # Do not change the title, if the title changes, the import paths will be broken
  title: Api
  version: 0.1.0
  description: API specification
servers:
  - url: /api
    description: Base API path
tags:
  - name: health
    description: Health operations
paths:
  /socialomni/advanced/tasks:
    post:
      operationId: createAdvancedTask
      parameters: [{$ref: "#/components/parameters/Workspace"}]
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: "#/components/schemas/AdvancedTaskInput"}
      responses:
        "200": {$ref: "#/components/responses/WorkspaceState"}
  /socialomni/advanced/tasks/{id}:
    patch:
      operationId: editAdvancedTask
      parameters: [{$ref: "#/components/parameters/Workspace"}, {$ref: "#/components/parameters/RecordId"}]
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: "#/components/schemas/AdvancedTaskInput"}
      responses:
        "200": {$ref: "#/components/responses/WorkspaceState"}
    delete:
      operationId: deleteAdvancedTask
      parameters: [{$ref: "#/components/parameters/Workspace"}, {$ref: "#/components/parameters/RecordId"}]
      responses:
        "200": {$ref: "#/components/responses/WorkspaceState"}
  /socialomni/advanced/tasks/{id}/run:
    post:
      operationId: runAdvancedTask
      parameters: [{$ref: "#/components/parameters/Workspace"}, {$ref: "#/components/parameters/RecordId"}]
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: "#/components/schemas/AdvancedApproval"}
      responses:
        "200": {$ref: "#/components/responses/WorkspaceState"}
  /socialomni/advanced/tasks/{id}/cancel:
    post:
      operationId: cancelAdvancedTask
      parameters: [{$ref: "#/components/parameters/Workspace"}, {$ref: "#/components/parameters/RecordId"}]
      responses:
        "200": {$ref: "#/components/responses/WorkspaceState"}
  /socialomni/advanced/connections/{id}:
    put:
      operationId: saveAdvancedConnection
      parameters: [{$ref: "#/components/parameters/Workspace"}, {$ref: "#/components/parameters/RecordId"}]
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: "#/components/schemas/AdvancedConnectionInput"}
      responses:
        "200": {$ref: "#/components/responses/WorkspaceState"}
    delete:
      operationId: deleteAdvancedConnection
      parameters: [{$ref: "#/components/parameters/Workspace"}, {$ref: "#/components/parameters/RecordId"}]
      responses:
        "200": {$ref: "#/components/responses/WorkspaceState"}
  /socialomni/advanced/telegram/auth:
    post:
      operationId: authorizeTelegram
      parameters: [{$ref: "#/components/parameters/Workspace"}]
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: "#/components/schemas/TelegramAuthInput"}
      responses:
        "200": {$ref: "#/components/responses/WorkspaceState"}
  /socialomni/advanced/results/{id}:
    delete:
      operationId: deleteAdvancedResult
      parameters: [{$ref: "#/components/parameters/Workspace"}, {$ref: "#/components/parameters/RecordId"}]
      responses:
        "200": {$ref: "#/components/responses/WorkspaceState"}
  /socialomni/suite/ai:
    put:
      operationId: saveWaAi
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: "#/components/schemas/WaAiInput"}
      responses:
        "200":
          description: Public configuration only; never returns the key
          content:
            application/json:
              schema: {$ref: "#/components/schemas/SimulatorState"}
  /socialomni/suite/menu:
    put:
      operationId: saveWaMenu
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: "#/components/schemas/WaMenuInput"}
      responses:
        "200":
          description: Saved exact-match menu rules
          content:
            application/json:
              schema: {$ref: "#/components/schemas/SimulatorState"}
  /socialomni/suite/filter:
    put:
      operationId: saveWaFilter
      parameters: [{$ref: "#/components/parameters/Workspace"}]
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: "#/components/schemas/WaFilterInput"}
      responses:
        "200": {$ref: "#/components/responses/WorkspaceState"}
  /socialomni/suite/threads:
    post:
      operationId: createCrmThread
      parameters: [{$ref: "#/components/parameters/Workspace"}]
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: "#/components/schemas/CrmThreadInput"}
      responses:
        "200": {$ref: "#/components/responses/WorkspaceState"}
  /socialomni/suite/threads/{id}:
    patch:
      operationId: editCrmThread
      parameters: [{$ref: "#/components/parameters/Workspace"}, {$ref: "#/components/parameters/RecordId"}]
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: "#/components/schemas/CrmThreadInput"}
      responses:
        "200": {$ref: "#/components/responses/WorkspaceState"}
    delete:
      operationId: removeCrmThread
      parameters: [{$ref: "#/components/parameters/Workspace"}, {$ref: "#/components/parameters/RecordId"}]
      responses:
        "200": {$ref: "#/components/responses/WorkspaceState"}
  /socialomni/suite/rules:
    post:
      operationId: createChatbotRule
      parameters: [{$ref: "#/components/parameters/Workspace"}]
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: "#/components/schemas/ChatbotRuleInput"}
      responses:
        "200": {$ref: "#/components/responses/WorkspaceState"}
  /socialomni/suite/rules/{id}:
    patch:
      operationId: editChatbotRule
      parameters: [{$ref: "#/components/parameters/Workspace"}, {$ref: "#/components/parameters/RecordId"}]
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: "#/components/schemas/ChatbotRuleInput"}
      responses:
        "200": {$ref: "#/components/responses/WorkspaceState"}
    delete:
      operationId: removeChatbotRule
      parameters: [{$ref: "#/components/parameters/Workspace"}, {$ref: "#/components/parameters/RecordId"}]
      responses:
        "200": {$ref: "#/components/responses/WorkspaceState"}
  /socialomni/suite/session:
    post:
      operationId: startWaSuiteSession
      parameters: [{$ref: "#/components/parameters/Workspace"}]
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: "#/components/schemas/WaSessionInput"}
      responses:
        "200": {$ref: "#/components/responses/WorkspaceState"}
  /socialomni/browser/jobs:
    post:
      operationId: startLocalBrowserTask
      summary: Start an explicitly approved desktop-only browser task
      parameters:
        - $ref: "#/components/parameters/Workspace"
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: "#/components/schemas/BrowserTaskInput"}
      responses:
        "200":
          $ref: "#/components/responses/WorkspaceState"
        "400":
          description: Invalid task or missing consent
        "422":
          description: Local browser execution is unavailable in hosted preview
  /socialomni/download:
    get:
      operationId: downloadDesktopPackage
      summary: Download the complete standalone desktop application ZIP
      responses:
        "200":
          description: ZIP attachment with desktop runtime and application source
          headers:
            Content-Disposition:
              schema:
                type: string
          content:
            application/zip:
              schema:
                type: string
                format: binary
        "503":
          description: Desktop package has not been generated
  /socialomni/leads:
    put:
      operationId: saveSocialOmniLeadDraft
      parameters: [{$ref: "#/components/parameters/Workspace"}]
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: "#/components/schemas/SimulatorLeadInput"}
      responses:
        "200":
          $ref: "#/components/responses/WorkspaceState"
    delete:
      operationId: clearSocialOmniLeads
      description: Clears synthetic results only; refuses while a lead simulation is active.
      parameters: [{$ref: "#/components/parameters/Workspace"}]
      responses:
        "200":
          $ref: "#/components/responses/WorkspaceState"
  /socialomni/state:
    get:
      operationId: getSocialOmniState
      parameters: [{$ref: "#/components/parameters/Workspace"}]
      responses:
        "200":
          $ref: "#/components/responses/WorkspaceState"
    delete:
      operationId: clearSocialOmniState
      parameters: [{$ref: "#/components/parameters/Workspace"}]
      responses:
        "200":
          $ref: "#/components/responses/WorkspaceState"
  /socialomni/settings:
    put:
      operationId: updateSocialOmniSettings
      parameters: [{$ref: "#/components/parameters/Workspace"}]
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: "#/components/schemas/SimulatorSettings"}
      responses:
        "200":
          $ref: "#/components/responses/WorkspaceState"
  /socialomni/jobs:
    post:
      operationId: createSocialOmniJob
      description: Creates a local simulation, never a platform action. Inputs are snapshotted from the saved draft.
      parameters: [{$ref: "#/components/parameters/Workspace"}]
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: "#/components/schemas/SimulatorJobInput"}
      responses:
        "200":
          $ref: "#/components/responses/WorkspaceState"
  /socialomni/jobs/{id}/cancel:
    post:
      operationId: cancelSocialOmniJob
      parameters:
        - {$ref: "#/components/parameters/Workspace"}
        - {$ref: "#/components/parameters/RecordId"}
      responses:
        "200":
          $ref: "#/components/responses/WorkspaceState"
  /socialomni/media:
    post:
      operationId: uploadSocialOmniMedia
      description: Stores image, video, or PDF bytes in local SQLite, limited to 5 MiB per file and 50 MiB per workspace. Live desktop WhatsApp jobs can attach these files.
      parameters: [{$ref: "#/components/parameters/Workspace"}]
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: "#/components/schemas/SimulatorUploadInput"}
      responses:
        "200":
          $ref: "#/components/responses/WorkspaceState"
  /socialomni/media/{id}:
    get:
      operationId: readSocialOmniMedia
      parameters:
        - {$ref: "#/components/parameters/Workspace"}
        - {$ref: "#/components/parameters/RecordId"}
      responses:
        "200":
          $ref: "#/components/responses/WorkspaceState"
    delete:
      operationId: deleteSocialOmniMedia
      description: Refuses to delete attachments referenced by a draft or an active simulation.
      parameters:
        - {$ref: "#/components/parameters/Workspace"}
        - {$ref: "#/components/parameters/RecordId"}
      responses:
        "200":
          $ref: "#/components/responses/WorkspaceState"
  /socialomni/{collection}:
    parameters:
      - {$ref: "#/components/parameters/Workspace"}
      - {$ref: "#/components/parameters/Collection"}
    post:
      operationId: createSocialOmniRecord
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: "#/components/schemas/SimulatorRecord"}
      responses:
        "200":
          $ref: "#/components/responses/WorkspaceState"
  /socialomni/{collection}/{id}:
    parameters:
      - {$ref: "#/components/parameters/Workspace"}
      - {$ref: "#/components/parameters/Collection"}
      - {$ref: "#/components/parameters/RecordId"}
    patch:
      operationId: updateSocialOmniRecord
      description: Full editable record fields, excluding server-owned ID and timestamps.
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: "#/components/schemas/SimulatorRecord"}
      responses:
        "200":
          $ref: "#/components/responses/WorkspaceState"
    delete:
      operationId: deleteSocialOmniRecord
      responses:
        "200":
          $ref: "#/components/responses/WorkspaceState"
  /healthz:
    get:
      operationId: healthCheck
      tags: [health]
      summary: Health check
      description: Returns server health status
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"
components:
  parameters:
    Workspace:
      name: x-socialomni-workspace
      in: header
      required: true
      schema: {type: string, format: uuid}
    RecordId:
      name: id
      in: path
      required: true
      schema: {type: string}
    Collection:
      name: collection
      in: path
      required: true
      schema: {type: string, enum: [campaigns, accounts, contacts]}
  responses:
    WorkspaceState:
      description: Updated workspace state; invalid inputs return 400 with an error message; missing records return 404.
      content:
        application/json:
          schema: {$ref: "#/components/schemas/SimulatorState"}
  schemas:
    AdvancedApproval:
      type: object
      required: [approved]
      properties:
        approved: {type: boolean}
    TelegramAuthInput:
      type: object
      required: [action, value]
      properties:
        action: {type: string, enum: [start, code, password]}
        value: {type: string, maxLength: 300}
    AdvancedConnectionInput:
      type: object
      properties:
        host: {type: string}
        port: {type: integer}
        secure: {type: boolean}
        username: {type: string}
        password: {type: string}
        from: {type: string}
        apiId: {type: integer}
        apiHash: {type: string}
    AdvancedTaskInput:
      type: object
      required: [kind, name]
      properties:
        kind: {type: string, enum: [whatsapp-members, maps, b2b, verify-email, email-send, telegram-send, telegram-members, telegram-channel, facebook-search, facebook-join, facebook-post, instagram-post]}
        name: {type: string, maxLength: 150}
        source: {type: string, maxLength: 15000}
        message: {type: string, maxLength: 10000}
        subject: {type: string, maxLength: 200}
        query: {type: string, maxLength: 300}
        limit: {type: integer, minimum: 1, maximum: 2000, description: "WhatsApp member extraction allows 2000; other task kinds allow 200."}
        accountId: {type: string}
        mediaId: {type: string}
        scheduledAt: {type: string}
        approved: {type: boolean}
    AdvancedTask:
      allOf:
        - {$ref: "#/components/schemas/AdvancedTaskInput"}
        - type: object
          required: [id, status, progress, completedCount, totalCount, phase, createdAt, error]
          properties:
            id: {type: string}
            status: {type: string, enum: [Draft, Scheduled, Queued, Running, Completed, Cancelled, Failed, Needs review]}
            progress: {type: integer}
            completedCount: {type: integer}
            totalCount: {type: integer}
            phase: {type: string}
            createdAt: {type: string}
            error: {type: string}
            nextActionAt: {type: [string, "null"]}
    AdvancedResult:
      type: object
      required: [id, taskId, kind, name, phone, email, address, website, status, reason, createdAt]
      properties:
        userId: {type: string}
        username: {type: string}
        id: {type: string}
        taskId: {type: string}
        kind: {type: string}
        name: {type: string}
        phone: {type: string}
        email: {type: string}
        address: {type: string}
        website: {type: string}
        status: {type: string}
        reason: {type: string}
        createdAt: {type: string}
    AdvancedConnection:
      type: object
      required: [id, configured, connected, label, stage, error]
      properties:
        id: {type: string, enum: [smtp, telegram]}
        configured: {type: boolean}
        connected: {type: boolean}
        label: {type: string}
        stage: {type: string}
        error: {type: string}
    AdvancedSuite:
      type: object
      required: [tasks, results, connections]
      properties:
        tasks: {type: array, items: {$ref: "#/components/schemas/AdvancedTask"}}
        results: {type: array, items: {$ref: "#/components/schemas/AdvancedResult"}}
        connections: {type: array, items: {$ref: "#/components/schemas/AdvancedConnection"}}
    WaSessionInput:
      type: object
      required: [action, accountId, approved]
      properties:
        action: {type: string, enum: [filter, inbox]}
        accountId: {type: string}
        approved: {type: boolean}
        replyToExistingUnread: {type: boolean, default: false, description: Explicitly approve replies to existing unread messages in opted-in direct chats}
    WaFilterInput:
      type: object
      required: [source]
      properties:
        source: {type: string, maxLength: 10000}
    CrmThreadInput:
      type: object
      required: [name, phone, status, notes, optedIn]
      properties:
        consentChanged: {type: boolean, description: Set false on note-only edits to preserve concurrent opt-outs}
        name: {type: string, maxLength: 150}
        phone: {type: string, maxLength: 30}
        status: {type: string, enum: [New, Follow-up, Closed/Won, Urgent]}
        notes: {type: string, maxLength: 10000}
        tags: {type: array, maxItems: 20, items: {type: string, minLength: 1, maxLength: 50}}
        optedIn: {type: boolean}
    ChatbotRuleInput:
      type: object
      required: [name, keyword, match, template, enabled, delayMin, delayMax, cooldownMinutes]
      properties:
        enabledChanged: {type: boolean, description: Set false on template-only edits to preserve concurrent rule disabling}
        name: {type: string, maxLength: 100}
        keyword: {type: string, maxLength: 200}
        match: {type: string, enum: [contains, exact]}
        template: {type: string, maxLength: 2000}
        enabled: {type: boolean}
        delayMin: {type: integer, minimum: 3, maximum: 8}
        delayMax: {type: integer, minimum: 3, maximum: 8}
        cooldownMinutes: {type: integer, minimum: 1, maximum: 1440}
    ChatbotRule:
      allOf:
        - {$ref: "#/components/schemas/ChatbotRuleInput"}
        - type: object
          required: [id, createdAt]
          properties:
            id: {type: string}
            createdAt: {type: string}
    CrmMessage:
      type: object
      required: [id, text, direction, timestamp, status]
      properties:
        id: {type: string}
        text: {type: string}
        direction: {type: string, enum: [incoming, outgoing]}
        timestamp: {type: string}
        status: {type: string, enum: [Received, Accepted, Unconfirmed]}
        ruleId: {type: string}
    CrmThread:
      allOf:
        - {$ref: "#/components/schemas/CrmThreadInput"}
        - type: object
          required: [id, contactId, messages, updatedAt]
          properties:
            id: {type: string}
            contactId: {type: [string, "null"]}
            accountId: {type: [string, "null"]}
            remoteKey: {type: [string, "null"]}
            updatedAt: {type: string}
            messages: {type: array, items: {$ref: "#/components/schemas/CrmMessage"}}
    WaFilterResult:
      type: object
      required: [id, input, phone, status, reason]
      properties:
        id: {type: string}
        input: {type: string}
        phone: {type: string}
        status: {type: string, enum: [Unverified, Active/Valid, Inactive, Unknown]}
        reason: {type: string}
        checkedAt: {type: [string, "null"]}
    WaAiSettings:
      type: object
      required: [enabled, hasKey, model, instructions, revision]
      properties:
        enabled: {type: boolean}
        hasKey: {type: boolean}
        model: {type: string}
        instructions: {type: string}
        revision: {type: string}
    WaAiInput:
      type: object
      required: [enabled, instructions]
      properties:
        enabled: {type: boolean}
        instructions: {type: string, maxLength: 2000}
        key: {type: string, writeOnly: true, maxLength: 503}
        removeKey: {type: boolean}
    WaMenuInput:
      type: object
      required: [keyword, menu, sales, support]
      properties:
        keyword: {type: string, minLength: 1, maxLength: 200}
        menu: {type: string, minLength: 1, maxLength: 2000}
        sales: {type: string, minLength: 1, maxLength: 2000}
        support: {type: string, minLength: 1, maxLength: 2000}
    WaSuite:
      type: object
      required: [filter, threads, rules]
      properties:
        filter:
          type: object
          required: [source, results]
          properties:
            source: {type: string}
            results: {type: array, items: {$ref: "#/components/schemas/WaFilterResult"}}
        threads: {type: array, items: {$ref: "#/components/schemas/CrmThread"}}
        rules: {type: array, items: {$ref: "#/components/schemas/ChatbotRule"}}
        ai: {$ref: "#/components/schemas/WaAiSettings"}
    BrowserTaskInput:
      type: object
      required: [action, accountId]
      properties:
        action: {type: string, enum: [connect, search, send, join, publish]}
        accountId: {type: string}
        campaignId: {type: string}
        keywords: {type: string, maxLength: 300}
        groupUrls: {type: string, maxLength: 5000}
        approved: {type: boolean, description: Explicit recipient consent or group posting permission attestation}
    SimulatorJobInput:
      type: object
      required: [kind]
      properties:
        mode: {type: string, enum: [live, rehearsal]}
        kind: {type: string, enum: [campaign, whatsapp, leads]}
        campaignId: {type: string}
    SimulatorUploadInput:
      type: object
      required: [name, mime, data]
      properties:
        name: {type: string, maxLength: 200}
        mime: {type: string, enum: [image/png, image/jpeg, image/webp, image/gif, video/mp4, video/webm, application/pdf]}
        data: {type: string, description: Base64 encoded file without a data URL prefix}
    SimulatorSettings:
      type: object
      description: Partial updates preserve omitted fields.
      properties:
        theme: {type: string, enum: [light, dark]}
        language: {type: string, enum: [en, ar], default: en, description: Persisted display language; API enum values and user content remain unchanged.}
        keywords: {type: string, maxLength: 300}
        delayMin: {type: integer, minimum: 5, maximum: 12}
        delayMax: {type: integer, minimum: 5, maximum: 12}
        phoneNumbers: {type: string, maxLength: 10000}
        messageContent: {type: string, maxLength: 10000}
        mediaId: {type: [string, "null"]}
        accountId: {type: [string, "null"]}
        licenseKey: {type: string, maxLength: 200, description: Locally stored future-license placeholder; no activation or validation}
    SimulatorRecord:
      type: object
      description: Campaign fields title/platform/caption/scheduledAt/status; account fields displayLabel/platform/handle/status; contact fields name/channel/value/optedIn/list.
      properties:
        title: {type: string}
        platform: {type: string, enum: [Facebook, Instagram, WhatsApp, TikTok]}
        caption: {type: string, maxLength: 1000}
        scheduledAt: {type: string}
        status: {type: string}
        keywords: {type: string}
        targetGroupCount: {type: integer, minimum: 1, maximum: 1000}
        mediaId: {type: [string, "null"]}
        accountId: {type: [string, "null"]}
        displayLabel: {type: string}
        handle: {type: string}
        demoSession: {type: string, description: Fake demo- reference only; never an actual session cookie}
        name: {type: string}
        channel: {type: string, enum: [Email, Phone]}
        value: {type: string}
        optedIn: {type: boolean}
        list: {type: string}
    SimulatorMedia:
      type: object
      required: [id, name, mime, size]
      properties:
        id: {type: string}
        name: {type: string}
        mime: {type: string}
        size: {type: integer}
        dataUrl: {type: string}
    SimulatorTarget:
      type: object
      required: [id, name, joinStatus, postStatus, sendStatus]
      properties:
        id: {type: string}
        name: {type: string}
        joinStatus: {type: string, enum: [Pending, Joined, Requested, Needs review]}
        postStatus: {type: string, enum: [Pending, Posted, Not posted, Unconfirmed]}
        sendStatus: {type: string, enum: [Pending, Sent, Unconfirmed, Failed]}
        error: {type: string}
    SimulatorJob:
      type: object
      required: [id, kind, status, progress, currentStep, steps, createdAt]
      properties:
        mode: {type: string, enum: [live]}
        action: {type: string}
        platform: {type: string, enum: [Facebook, WhatsApp, Maps]}
        discoveredGroups:
          type: array
          items: {$ref: "#/components/schemas/DiscoveredGroup"}
        id: {type: string}
        kind: {type: string, enum: [campaign, whatsapp, leads]}
        campaignId: {type: [string, "null"]}
        status: {type: string, enum: [Pending, Running, Completed, Cancelled, Failed]}
        progress: {type: integer}
        currentStep: {type: integer}
        steps: {type: array, items: {type: string}}
        createdAt: {type: string}
        targets: {type: array, items: {$ref: "#/components/schemas/SimulatorTarget"}}
        completedCount: {type: integer}
        totalCount: {type: integer}
        phase: {type: string}
        error: {type: string}
        nextActionAt: {type: [string, "null"]}
        accountName: {type: string}
        mediaName: {type: [string, "null"]}
        mediaId: {type: [string, "null"]}
        replyToExistingUnread: {type: boolean}
        messageContent: {type: string}
    SimulatorLeadInput:
      type: object
      required: [keyword, city, targetCount]
      properties:
        keyword: {type: string, maxLength: 100}
        city: {type: string, maxLength: 150}
        targetCount: {type: integer, minimum: 1, maximum: 200}
    SimulatorLead:
      type: object
      required: [id, businessName, phoneNumber, address, website, keyword, city, jobId, createdAt, simulated]
      properties:
        id: {type: string}
        businessName: {type: string}
        phoneNumber: {type: string}
        address: {type: string}
        website: {type: string}
        keyword: {type: string}
        city: {type: string}
        jobId: {type: string}
        createdAt: {type: string}
        simulated: {type: boolean}
    SimulatorLeadWorkspace:
      allOf:
        - {$ref: "#/components/schemas/SimulatorLeadInput"}
        - type: object
          required: [results]
          properties:
            results: {type: array, items: {$ref: "#/components/schemas/SimulatorLead"}}
    SimulatorAnalytics:
      type: object
      required: [messagesSent]
      properties:
        realMessagesSent: {type: integer, minimum: 0, description: Cumulative server-accepted live WhatsApp sends; separate from simulations}
        messagesSent: {type: integer, minimum: 0, description: Cumulative simulated sends, unaffected by job-history pruning}
    SimulatorState:
      type: object
      required: [store, settings, jobs, initialized, media, leads, analytics]
      properties:
        advanced: {$ref: "#/components/schemas/AdvancedSuite"}
        automationAvailable: {type: boolean}
        waSuite: {$ref: "#/components/schemas/WaSuite"}
        store:
          type: object
          required: [campaigns, accounts, contacts, lists, activity]
          properties:
            campaigns: {type: array, items: {type: object, additionalProperties: true}}
            accounts: {type: array, items: {type: object, additionalProperties: true}}
            contacts: {type: array, items: {type: object, additionalProperties: true}}
            lists: {type: array, items: {type: string}}
            activity: {type: array, items: {type: object, additionalProperties: true}}
        settings: {$ref: "#/components/schemas/SimulatorSettings"}
        jobs: {type: array, items: {$ref: "#/components/schemas/SimulatorJob"}}
        initialized: {type: boolean}
        media: {type: array, items: {$ref: "#/components/schemas/SimulatorMedia"}}
        mediaContent: {$ref: "#/components/schemas/SimulatorMedia"}
        leads: {$ref: "#/components/schemas/SimulatorLeadWorkspace"}
        analytics: {$ref: "#/components/schemas/SimulatorAnalytics"}
    HealthStatus:
      type: object
      properties:
        status:
          type: string
      required:
        - status
    DiscoveredGroup:
      type: object
      required: [name, url]
      properties:
        name: {type: string}
        url: {type: string}

